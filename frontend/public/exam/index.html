<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VIT Portal - Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="card">
        <div class="card-body">
          <h3 class="card-title">Web Languages Practice Exam</h3>
          <p class="text-muted">Covers HTML, CSS, JavaScript, jQuery, Bootstrap. Timer: <span id="timer">--:--</span></p>

          <div id="quiz-area"></div>

          <div class="mt-3 d-flex justify-content-between">
            <button id="prevBtn" class="btn btn-secondary">Previous</button>
            <div>
              <button id="saveBtn" class="btn btn-outline-primary">Save Progress</button>
              <button id="submitBtn" class="btn btn-primary">Submit Exam</button>
            </div>
          </div>

          <div id="resultArea" class="mt-4" style="display:none;"></div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
